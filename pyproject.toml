[project]
name = "codeecho"
version = "1.0.1"
description = "A developer tool that scans your codebase to detect and highlight ECHOES of duplicated or near-duplicated code so you can refactor toward cleaner, more maintainable designs."
authors = [
    {name = "Ron Webb"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
dependencies = [
    "logenrich (>=1.0.1,<2.0.0)",
    "env-dir-bootstrap (>=1.1.0,<2.0.0)",
    "tree-sitter (>=0.26.0,<0.27.0)",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
    "tree-sitter-javascript (>=0.25.0,<0.26.0)",
    "tree-sitter-typescript (>=0.23.2,<0.24.0)",
    "tree-sitter-java (>=0.23.5,<0.24.0)",
    "tree-sitter-go (>=0.25.0,<0.26.0)",
    "click (>=8.4.2,<9.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "jinja2 (>=3.1)",
    "braincraft (>=1.2.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "codeecho"}]
include = ["codeecho/logging.ini", "codeecho/.ignore", "CHANGELOG.md"]

[tool.poetry.scripts]
codeecho = "codeecho.__main__:main"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pylint (>=4.0.6,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
